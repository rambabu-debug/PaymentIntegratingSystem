spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: ${SERVER_PORT:7070}

firebase:
  # Disable Firebase by default to avoid startup failures when credentials are not provided.
  # Set environment variable FIREBASE_ENABLED=true and provide GOOGLE_APPLICATION_CREDENTIALS
  # (path to service account JSON) to enable Firebase in your environment.
  enabled: ${FIREBASE_ENABLED:false}
  project-id: paymentintegratinsystem
  credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}

app:
  jwt:
    secret: ${JWT_SECRET:MyDefaultSecretKey1234567890@#MySecretKey}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_default}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_default}

logging:
  level:
    org.springframework.security: INFO
    com.google.firebase: DEBUG
    com.google.cloud: DEBUG
